worker_processes auto;
events { worker_connections 1024; }
http {
  include mime.types; default_type application/octet-stream;
  add_header X-Frame-Options DENY; add_header X-Content-Type-Options nosniff;
  add_header Strict-Transport-Security "max-age=31536000" always;
  server {
    listen 80; server_name _; return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl; server_name _;
    ssl_certificate /etc/nginx/ssl/cert.pem; ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/*.conf;
  }
}
