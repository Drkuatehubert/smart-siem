server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — toutes les routes non-fichier vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache assets statiques (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Désactiver le log des favicon 404
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
