version: "3.9"

# =============================================================================
# Smart SIEM — Orchestration centralisée (UCAC-ICAM)
# Usage prod  : docker compose up -d
# Usage dev   : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Elasticsearch : instance partagée via ngrok (voir ELASTICSEARCH_HOST dans .env)
# PostgreSQL    : instance locale (règles/alertes du moteur de corrélation, voir correlation_engine/)
# =============================================================================

networks:
  siem-network:
    driver: bridge

volumes:
  redisdata:
  reports:
  pgdata:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  #
  # elasticsearch : commenté — on utilise l'instance des camarades via ngrok.
  # URL configurée dans .env : ELASTICSEARCH_HOST=https://primate-stabilize-yin.ngrok-free.dev
  #
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
  #   container_name: siem-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #     - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
  #     - xpack.security.enabled=true
  #   volumes:
  #     - esdata:/usr/share/elasticsearch/data
  #     - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
  #     - ./docker/certs:/usr/share/elasticsearch/config/certs:ro
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - siem-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf ${ELASTICSEARCH_HOST}/_cluster/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Base de données PostgreSQL (moteur de corrélation) ──────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    environment:
      POSTGRES_DB: nafeh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: felicia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./temp-data/bd_schema/01_postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Collecte & Normalisation ─────────────────────────────────────────────────

  normalizer:
    build:
      context: "./COLLECTE & NORMALISATION/normalizer-api"
      dockerfile: Dockerfile
    container_name: siem-normalizer
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8443:443"
    volumes:
      - "./COLLECTE & NORMALISATION/normalizer-api/certs:/app/certs:ro"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent de collecte (démo) : normalement déployé directement sur les machines
  # à surveiller (voir "COLLECTE & NORMALISATION/agent de collecte/agentU.py" et
  # agentW.py pour Windows). Ici, conteneurisé à titre de démonstration : il tape
  # sur /var/log de l'hôte (monté en lecture seule) et envoie au normalizer via
  # le réseau interne docker-compose.
  agent-collecte:
    build:
      context: "./COLLECTE & NORMALISATION/agent de collecte"
      dockerfile: Dockerfile
    container_name: siem-agent-collecte
    environment:
      - AGENT_API_URL=https://normalizer:443/normalize/batch
      - AGENT_API_TOKEN=agent-token-ubuntu-01
      - AGENT_LOG_FILES=/var/log/auth.log,/var/log/syslog
    volumes:
      - /var/log:/var/log:ro
    networks:
      - siem-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # ── Backend FastAPI ───────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: siem-backend
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ELASTICSEARCH_TLS_VERIFY=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/1
      - PG_DSN=postgresql://postgres:felicia@postgres:5432/nafeh
      - JWT_EXPIRY_MINUTES=480
      - JWT_REFRESH_EXPIRY_MINUTES=10080
    ports:
      - "8000:8000"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Moteur de corrélation MITRE ATT&CK ───────────────────────────────────────
  # context : temp-data/ (contient correlation_engine_2.py + requirements.txt)
  # dockerfile : ../correlation/Dockerfile (relatif au context)

  correlation:
    build:
      context: ./temp-data
      dockerfile: ../correlation/Dockerfile
    container_name: siem-correlation
    env_file: .env
    environment:
      - ES_HOST=${ELASTICSEARCH_HOST}
      - ES_USER=${ELASTICSEARCH_USERNAME}
      - ES_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - PG_DSN=postgresql://postgres:felicia@postgres:5432/nafeh
    networks:
      - siem-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── SOAR Worker ───────────────────────────────────────────────────────────────
  # Build context = racine pour que "from soar import config" fonctionne.

  soar-worker:
    build:
      context: .
      dockerfile: soar/Dockerfile
    container_name: siem-soar-worker
    env_file: .env
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - ES_HOST=${ELASTICSEARCH_HOST}
      - ES_USER=${ELASTICSEARCH_USERNAME:-elastic}
      - ES_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - PG_DSN=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smartsiem
      - API_NOTIFY_URL=http://backend:8000/internal/alert-triggered
    networks:
      - siem-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend React ────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    container_name: siem-frontend
    ports:
      - "3000:80"
    networks:
      - siem-network
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: siem-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - siem-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
