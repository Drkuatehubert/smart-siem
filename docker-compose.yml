version: "3.9"

# =============================================================================
# Smart SIEM — Orchestration centralisée (UCAC-ICAM)
# Usage prod  : docker compose up -d
# Usage dev   : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Elasticsearch : instance partagée via ngrok (voir ELASTICSEARCH_HOST dans .env)
# PostgreSQL    : instance locale (règles/alertes du moteur de corrélation, voir correlation_engine/)
# =============================================================================

networks:
  siem-network:
    driver: bridge

volumes:
  redisdata:
  pgdata:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  #
  # elasticsearch : commenté — on utilise l'instance des camarades via ngrok.
  # URL configurée dans .env : ELASTICSEARCH_HOST=https://primate-stabilize-yin.ngrok-free.dev
  #
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
  #   container_name: siem-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #     - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
  #     - xpack.security.enabled=true
  #   volumes:
  #     - esdata:/usr/share/elasticsearch/data
  #     - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
  #     - ./docker/certs:/usr/share/elasticsearch/config/certs:ro
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - siem-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf ${ELASTICSEARCH_HOST}/_cluster/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL : stockage relationnel du moteur de corrélation (correlation_engine/) —
  # règles, alertes, playbooks. Séparé d'Elasticsearch qui reste la source des logs bruts/normalisés.
  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    environment:
      - POSTGRES_DB=smartsiem
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./correlation_engine/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Collecte & Normalisation ─────────────────────────────────────────────────

  normalizer:
    build:
      context: "./COLLECTE & NORMALISATION/normalizer-api"
      dockerfile: Dockerfile
    container_name: siem-normalizer
    env_file: .env
    ports:
      - "8443:443"
    volumes:
      - "./COLLECTE & NORMALISATION/normalizer-api/certs:/app/certs:ro"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent de collecte (démo) : normalement déployé directement sur les machines
  # à surveiller (voir "COLLECTE & NORMALISATION/agent de collecte/agentU.py" et
  # agentW.py pour Windows). Ici, conteneurisé à titre de démonstration : il tape
  # sur /var/log de l'hôte (monté en lecture seule) et envoie au normalizer via
  # le réseau interne docker-compose.
  agent-collecte:
    build:
      context: "./COLLECTE & NORMALISATION/agent de collecte"
      dockerfile: Dockerfile
    container_name: siem-agent-collecte
    environment:
      - AGENT_API_URL=https://normalizer:443/normalize/batch
      - AGENT_API_TOKEN=agent-token-ubuntu-01
      - AGENT_LOG_FILES=/var/log/auth.log,/var/log/syslog
    volumes:
      - /var/log:/var/log:ro
    networks:
      - siem-network
    depends_on:
      - normalizer
    restart: unless-stopped

  # ── Backend FastAPI ───────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: siem-backend
    env_file: .env
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
    ports:
      - "8000:8000"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Corrélation MITRE ATT&CK ─────────────────────────────────────────────────
  # Moteur de corrélation (correlation_engine/) : lit les logs normalisés dans
  # Elasticsearch (idx-logs), évalue les règles YAML (seedées dans PostgreSQL au
  # démarrage par seed_rules.py), et écrit les alertes dans PostgreSQL.

  correlation-engine:
    build: ./correlation_engine
    container_name: siem-correlation-engine
    env_file: .env
    environment:
      - ES_HOST=${ELASTICSEARCH_HOST}
      - ES_USER=${ELASTICSEARCH_USERNAME:-elastic}
      - ES_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - PG_DSN=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smartsiem
      - API_NOTIFY_URL=http://backend:8000/internal/alert-triggered
    networks:
      - siem-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend React ────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    container_name: siem-frontend
    ports:
      - "3000:80"
    networks:
      - siem-network
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: siem-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - siem-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
