version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./docker/certs:/certs:ro
    restart: unless-stopped

  correlation:
    build: ./correlation
    env_file: .env
    restart: unless-stopped

  soar:
    build: ./soar
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

  reporting:
    build: ./reporting
    env_file: .env
    volumes:
      - reports:/app/generated_reports
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  redisdata:
  reports:
