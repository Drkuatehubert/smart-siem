version: "3.9"

# =============================================================================
# Smart SIEM — Orchestration centralisée (UCAC-ICAM)
# Usage prod  : docker compose up -d
# Usage dev   : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Elasticsearch : instance partagée via ngrok (voir ELASTICSEARCH_HOST dans .env)
# Redis         : instance locale (nécessaire pour la queue SOAR)
# =============================================================================

networks:
  siem-network:
    driver: bridge

volumes:
  redisdata:
  reports:
  pgdata:
  esdata:

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: siem-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=8-0Il66xvSeGnK=COySu
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.keystore.path=elastic-certificates.p12
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.keystore.path=elastic-certificates.p12
    command: >
      bash -c "
      if [ ! -f /usr/share/elasticsearch/config/elastic-certificates.p12 ]; then
        elasticsearch-certutil ca --out /usr/share/elasticsearch/config/elastic-ca.p12 --pass '' &&
        elasticsearch-certutil cert --ca /usr/share/elasticsearch/config/elastic-ca.p12 --ca-pass '' --out /usr/share/elasticsearch/config/elastic-certificates.p12 --pass ''
      fi &&
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -k -u elastic:'8-0Il66xvSeGnK=COySu' https://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Base de données PostgreSQL (moteur de corrélation) ──────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    environment:
      POSTGRES_DB: nafeh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: felicia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./temp-data/bd_schema/01_postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Collecte & Normalisation ─────────────────────────────────────────────────

  normalizer:
    build:
      context: "./COLLECTE & NORMALISATION/normalizer-api"
      dockerfile: Dockerfile
    container_name: siem-normalizer
    env_file: .env
    environment:
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=8-0Il66xvSeGnK=COySu
      - ELASTICSEARCH_TLS_VERIFY=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8443:443"
    volumes:
      - "./COLLECTE & NORMALISATION/normalizer-api/certs:/app/certs:ro"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend FastAPI ───────────────────────────────────────────────────────────

  backend:
    build: ./backend
    container_name: siem-backend
    env_file: .env
    environment:
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=8-0Il66xvSeGnK=COySu
      - ELASTICSEARCH_TLS_VERIFY=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/1
      - PG_DSN=postgresql://postgres:felicia@postgres:5432/nafeh
      - JWT_EXPIRY_MINUTES=480
      - JWT_REFRESH_EXPIRY_MINUTES=10080
    ports:
      - "8000:8000"
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Moteur de corrélation MITRE ATT&CK ───────────────────────────────────────
  # context : temp-data/ (contient correlation_engine_2.py + requirements.txt)
  # dockerfile : ../correlation/Dockerfile (relatif au context)

  correlation:
    build:
      context: ./temp-data
      dockerfile: ../correlation/Dockerfile
    container_name: siem-correlation
    env_file: .env
    environment:
      - ES_HOST=https://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=8-0Il66xvSeGnK=COySu
      - PG_DSN=postgresql://postgres:felicia@postgres:5432/nafeh
    networks:
      - siem-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── SOAR Worker ───────────────────────────────────────────────────────────────
  # Build context = racine pour que "from soar import config" fonctionne.

  soar-worker:
    build:
      context: .
      dockerfile: soar/Dockerfile
    container_name: siem-soar-worker
    env_file: .env
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - ES_HOST=https://elasticsearch:9200
      - PG_DSN=postgresql://postgres:felicia@postgres:5432/nafeh
    networks:
      - siem-network
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Reporting ─────────────────────────────────────────────────────────────────

  reporting:
    build: ./reporting
    container_name: siem-reporting
    env_file: .env
    environment:
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
    volumes:
      - reports:/app/generated_reports
    networks:
      - siem-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ── Frontend React ────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    container_name: siem-frontend
    ports:
      - "3000:80"
    networks:
      - siem-network
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: siem-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - siem-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
